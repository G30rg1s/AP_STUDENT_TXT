
services:

  # ========================================
  # MYSQL
  # ========================================
  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: production
      MYSQL_USER: cf_user
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "1234"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 5s
      timeout: 5s
      retries: 30

  # ========================================
  # APP LOGS INITIALIZATION
  # ========================================
  app-logs-init:
    image: alpine:3.20

    user: "0:0"

    command:
      - sh
      - -c
      - |
        mkdir -p /app/logs
        chown -R 10001:10001 /app/logs
        chmod 750 /app/logs

    volumes:
      - app_logs_data:/app/logs

    restart: "no"

  # ========================================
  # GVM RUNNER - BACKEND + PARSER
  # ========================================
  ap-runner:
    image: ghcr.io/g30rg1s/gvm-runner:latest

    # Updates controlled by Student Launcher
    pull_policy: missing

    # Dynamic host port
    # Backend listens on 8081 inside container
    # Dynamic host port
    # Backend listens on 8080 inside container
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    environment:

      # ENCRYPTED TXT
      GVM_TXT_PATH: "/app/application.gvm.txt"

      # PRODUCTION DATABASE
      DB_URL: "jdbc:mysql://db:3306/production?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: cf_user
      DB_PASSWORD: "1234"

      # FRONTEND TEST DATABASE
      FRONTEND_TEST_DB_URL: "jdbc:mysql://db:3306/frontendtesting?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      FRONTEND_TEST_DB_USERNAME: cf_user
      FRONTEND_TEST_DB_PASSWORD: "1234"

      # API TEST DATABASE
      API_TEST_DB_URL: "jdbc:mysql://db:3306/apitesting?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      API_TEST_DB_USERNAME: cf_user
      API_TEST_DB_PASSWORD: "1234"

      # KAFKA
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

      # EXISTING LICENSE STORAGE - UNCHANGED
      CF_LICENSE_STORAGE_PATH: "/app/data/license/activation.json"

      # JWT SECURITY
      JWT_SECRET: "${JWT_SECRET:-}"

      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

      # LOGS
      AUTOMATION_LOG_FILE: "/app/logs/automation.log"
      PARSER_LOG_FILE: "/app/logs/parser.log"

    volumes:

      # Encrypted TXT downloaded by Student Launcher
      - type: bind
        source: ./releases/application.gvm.txt
        target: /app/application.gvm.txt
        read_only: true
        bind:
          create_host_path: false

      # Persistent application data
      - license_data:/app/data/license
      - uploads_data:/app/uploads
      - app_logs_data:/app/logs

    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app-logs-init:
        condition: service_completed_successfully

    restart: unless-stopped

  # ========================================
  # KAFKA
  # ========================================
  kafka:
    image: apache/kafka:3.9.1

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

# ========================================
# PERSISTENT VOLUMES
# ========================================
volumes:
  mysql_data:
  license_data:
  uploads_data:
  app_logs_data:
