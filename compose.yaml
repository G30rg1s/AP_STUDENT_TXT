services:

  # ========================================
  # MYSQL
  # ========================================

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: production
      MYSQL_USER: cf_user
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "1234"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30


  # ========================================
  # BACKEND
  # ========================================

  backend:
    image: ghcr.io/g30rg1s/coding-factory-automation:latest

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    environment:

      # PRODUCTION DATABASE
      DB_URL: "jdbc:mysql://db:3306/production?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: cf_user
      DB_PASSWORD: "1234"

      # FRONTEND TESTING DATABASE
      FRONTEND_TEST_DB_URL: "jdbc:mysql://db:3306/frontendtesting?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      FRONTEND_TEST_DB_USERNAME: cf_user
      FRONTEND_TEST_DB_PASSWORD: "1234"

      # API TESTING DATABASE
      API_TEST_DB_URL: "jdbc:mysql://db:3306/apitesting?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      API_TEST_DB_USERNAME: cf_user
      API_TEST_DB_PASSWORD: "1234"

      # KAFKA
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

      # LICENSE
      CF_LICENSE_STORAGE_PATH: "/app/data/license/activation.json"

      # SECURITY
      JWT_SECRET: "${JWT_SECRET:?Copy .env.example to .env before starting}"

      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

    volumes:
      - license_data:/app/data/license
      - uploads_data:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy


  # ========================================
  # KAFKA
  # ========================================

  kafka:
    image: apache/kafka:3.9.1

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s


# ========================================
# VOLUMES
# ========================================

volumes:
  mysql_data:
  license_data:
  uploads_data: